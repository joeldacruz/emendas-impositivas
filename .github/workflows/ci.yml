name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emendas
          POSTGRES_PASSWORD: emendas_ci
          POSTGRES_DB: emendas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emendas -d emendas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://emendas:emendas_ci@localhost:5432/emendas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes (PostgreSQL real)
        run: npm test
      - name: Build
        run: npm run build
